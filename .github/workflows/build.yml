name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64-portable:
    name: Windows x64 便携版
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 读取版本号
        shell: bash
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: 安装依赖
        run: npm ci

      # 便携版只产出单个可执行文件，跳过安装器打包（Tauri 2 用 --no-bundle，--bundles 不再接受 none）
      - name: 构建便携版
        run: npm run tauri build -- --no-bundle

      - name: 收集产物
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-portable | Out-Null
          $exe = Get-ChildItem "src-tauri/target/release" -Filter *.exe |
            Where-Object { $_.Name -match 'albumark' } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $exe) { throw "未找到 albumark 可执行文件" }
          Copy-Item $exe.FullName ("dist-portable/Albumark_{0}_windows-x64-portable.exe" -f $env:VERSION)

      - uses: actions/upload-artifact@v4
        with:
          name: Albumark-${{ env.VERSION }}-windows-x64-portable
          path: dist-portable/*.exe
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 读取版本号
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: 安装依赖
        run: npm ci

      - name: 构建（.app 与 .dmg）
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: Albumark-${{ env.VERSION }}-macos-arm64
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # 缓存 GRADLE_USER_HOME（含 Gradle 发行包与依赖），替代 setup-java 已弃用的 cache: gradle
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: 接受 Android SDK 许可
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: 读取版本号
        run: echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: 安装依赖
        run: npm ci

      - name: 构建 Web 资源并同步
        run: |
          npm run build
          npx cap sync android

      # services.gradle.org 偶发 10 秒内连不上导致构建直接失败，这里只负责下载发行包并重试
      - name: 预下载 Gradle 发行包（失败自动重试）
        run: |
          cd android
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew --version && break
            if [ "$i" = 3 ]; then echo "Gradle 发行包下载失败" >&2; exit 1; fi
            echo "第 $i 次失败，10 秒后重试..."
            sleep 10
          done

      - name: 构建 APK（debug 可直接安装，release 未签名）
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Albumark-${{ env.VERSION }}-android-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
